spring.application.name=claims
server.port=8181

# Default is an in-memory H2 database (PostgreSQL mode) for local runs. For PostgreSQL set DB_URL, DB_USERNAME and
# DB_PASSWORD in the environment, e.g. DB_URL=jdbc:postgresql://localhost:5432/claims_db. No real credentials are stored here.
spring.datasource.url=${DB_URL:jdbc:h2:mem:claimsdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

# Flyway owns the schema; Hibernate only validates it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.flyway.enabled=true

springdoc.swagger-ui.path=/swagger-ui.html
