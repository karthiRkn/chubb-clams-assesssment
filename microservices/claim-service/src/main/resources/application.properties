spring.application.name=claim-service
server.port=8181

# This service owns its own database. Default is an in-memory H2 database (PostgreSQL mode) so nothing needs installing.
# For PostgreSQL set CLAIM_DB_URL, CLAIM_DB_USERNAME and CLAIM_DB_PASSWORD in the environment (the database must exist, and
# must not be one another service uses: see application-postgres.properties). Nothing secret is stored in this file.
# LOCK_TIMEOUT lets a transition wait for the row lock of a concurrent one instead of failing after H2's short default.
#spring.datasource.url=${CLAIM_DB_URL:jdbc:h2:mem:claimdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;LOCK_TIMEOUT=10000}
#spring.datasource.username=${CLAIM_DB_USERNAME:sa}
#spring.datasource.password=${CLAIM_DB_PASSWORD:}


spring.datasource.url=${CLAIM_DB_URL:jdbc:h2:mem:claimdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;LOCK_TIMEOUT=10000}
spring.datasource.username=${CLAIM_DB_USERNAME:sa}
spring.datasource.password=${CLAIM_DB_PASSWORD:}


# Flyway owns the schema; Hibernate only validates it. Each service has its own migration folder.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration/claim

springdoc.swagger-ui.path=/swagger-ui.html
# keep the token pasted into Authorize when the Swagger page is reloaded
springdoc.swagger-ui.persist-authorization=true

# Health: GET /actuator/health answers {"status":"UP"} without a token (and DOWN, HTTP 503, when the database is unreachable).
# Nothing else of the actuator is exposed.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# Tokens are issued by the User Service; this service only checks them. The signing secret has NO default: set JWT_SECRET (at
# least 32 characters, the SAME value for EVERY service) in the environment, or the service refuses to start.
claims.security.jwt.secret=${JWT_SECRET:}
claims.security.jwt.expiry=${JWT_EXPIRY:60m}

# The one service this one calls: to check that an officer a manager assigns a claim to is an active claims officer.
# Override with USER_SERVICE_URL when the User Service is elsewhere.
claims.services.user.url=${USER_SERVICE_URL:http://localhost:8185}
claims.downstream.connect-timeout=2s
claims.downstream.read-timeout=10s

# Optional allow-list of market codes, comma separated (e.g. claims.markets.allowed=SG,HK). The brief mentions six
# APAC markets without naming them, so this is empty: any 2-letter upper-case code is accepted until it is set.
claims.markets.allowed=
