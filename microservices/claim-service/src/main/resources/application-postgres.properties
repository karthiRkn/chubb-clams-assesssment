# Opt-in PostgreSQL profile: --spring.profiles.active=postgres. Credentials come ONLY from environment variables.
# NOT VERIFIED: this profile has not been run against a real PostgreSQL server. The database must already exist.
spring.datasource.url=${CLAIM_DB_URL:jdbc:postgresql://localhost:5432/claim_db}
spring.datasource.username=${CLAIM_DB_USERNAME}
spring.datasource.password=${CLAIM_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
