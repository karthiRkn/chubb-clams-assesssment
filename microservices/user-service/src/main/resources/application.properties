spring.application.name=user-service
server.port=8185

# This service owns its own database (never the Claim Service's: every service has a Flyway version 1 and a database keeps
# one history table, so two services in one database fail with "Migration checksum mismatch for migration version 1").
# Default is an in-memory H2 database (PostgreSQL mode) so nothing needs installing. For PostgreSQL set USER_DB_URL,
# USER_DB_USERNAME and USER_DB_PASSWORD in the environment (the database, e.g. user_db, must exist). Nothing secret is stored here.
#spring.datasource.url=${USER_DB_URL:jdbc:h2:mem:userdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;LOCK_TIMEOUT=10000}
#spring.datasource.username=${USER_DB_USERNAME:sa}
#spring.datasource.password=${USER_DB_PASSWORD:}

spring.datasource.url=jdbc:postgresql://localhost:5432/user_db
spring.datasource.username=postgres
spring.datasource.password=Karthi3710

spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Flyway owns the schema; Hibernate only validates it. Each service has its own migration folder.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration/user

springdoc.swagger-ui.path=/swagger-ui.html
# Authentication first in the Swagger UI, and keep the pasted token when the page is reloaded
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.persist-authorization=true

# Health: GET /actuator/health answers {"status":"UP"} without a token (and DOWN, HTTP 503, when the database is unreachable).
# Nothing else of the actuator is exposed.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# Tokens. The signing secret has NO default: set JWT_SECRET (at least 32 characters, the SAME value for EVERY service) in the
# environment, or the service refuses to start. Lifetime of a login token: claims.security.jwt.expiry.
claims.security.jwt.secret=${JWT_SECRET:MySuperSecretJwtKeyForClaimsSystem2026}
claims.security.jwt.expiry=${JWT_EXPIRY:60m}

# Optional first administrator, created at start-up only if that username does not exist yet (an existing user is never
# changed). Both come from the environment; nothing is committed.
claims.auth.bootstrap-admin.username=${BOOTSTRAP_ADMIN_USERNAME:}
claims.auth.bootstrap-admin.password=${BOOTSTRAP_ADMIN_PASSWORD:}

# DEMO USERS: admin1 (ADMIN), officer1 (CLAIMS_OFFICER), manager1 (MANAGER), claimant1 (CLAIMANT), all with the password
# below, so you can log in straight away. They are created only if missing and never reset. Anyone who reads this file can
# log in as an administrator, so set DEMO_USERS=false for anything that is not a demo.
claims.auth.demo-users.enabled=${DEMO_USERS:true}
claims.auth.demo-users.password=${DEMO_USERS_PASSWORD:password123}
# BCrypt cost factor: 10 is Spring's default. Tests lower it only to run fast.
claims.auth.bcrypt-strength=10
