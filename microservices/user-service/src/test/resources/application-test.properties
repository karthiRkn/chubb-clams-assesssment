# TEST-ONLY configuration. PostgreSQL is not installed on the dev laptop, so automated tests run against
# H2 in PostgreSQL-compatibility mode using the same Flyway migrations. This is NOT proof of PostgreSQL compatibility.
# The JWT secret is not here: every test JVM generates a random one (see IntegrationTestBase).
spring.datasource.url=jdbc:h2:mem:user_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;LOCK_TIMEOUT=10000
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration/user
# BCrypt at its cheapest, only so hundreds of test logins run fast
claims.auth.bcrypt-strength=4
# the committed application.properties turns the demo users on; the ordinary tests start from an empty users table
# (DemoUsersTest switches them on for itself)
claims.auth.demo-users.enabled=false
