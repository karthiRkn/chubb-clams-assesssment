# TEST-ONLY configuration. PostgreSQL is not installed on the dev laptop, so automated tests run against
# H2 in PostgreSQL-compatibility mode using the same Flyway migrations. This is NOT proof of PostgreSQL compatibility.
spring.datasource.url=jdbc:h2:mem:assessment_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;LOCK_TIMEOUT=10000
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration/assessment
# The Claim Service is replaced by a mock in these tests; this URL is never called.
claims.services.claim.url=http://localhost:1
