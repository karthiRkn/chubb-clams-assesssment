spring.application.name=assessment-service
server.port=8182

# This service owns its own database. Default is an in-memory H2 database (PostgreSQL mode) so nothing needs installing.
# For PostgreSQL set ASSESSMENT_DB_URL, ASSESSMENT_DB_USERNAME and ASSESSMENT_DB_PASSWORD in the environment (the database
# must exist, and must not be one another service uses: see application-postgres.properties). Nothing secret is stored here.
#spring.datasource.url=${ASSESSMENT_DB_URL:jdbc:h2:mem:assessmentdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;LOCK_TIMEOUT=10000}
#spring.datasource.username=${ASSESSMENT_DB_USERNAME:sa}
#spring.datasource.password=${ASSESSMENT_DB_PASSWORD:}


spring.datasource.url=${ASSESSMENT_DB_URL:jdbc:h2:mem:assessmentdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;LOCK_TIMEOUT=10000}
spring.datasource.username=${ASSESSMENT_DB_USERNAME:sa}
spring.datasource.password=${ASSESSMENT_DB_PASSWORD:}


# Flyway owns the schema; Hibernate only validates it. Each service has its own migration folder.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration/assessment

springdoc.swagger-ui.path=/swagger-ui.html
# keep the token pasted into Authorize when the Swagger page is reloaded
springdoc.swagger-ui.persist-authorization=true

# Health: GET /actuator/health answers {"status":"UP"} without a token (and DOWN, HTTP 503, when the database is unreachable).
# Nothing else of the actuator is exposed.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# Tokens are issued by the User Service; this service only checks them. The signing secret has NO default: set JWT_SECRET (at
# least 32 characters, the SAME value for EVERY service) in the environment, or the service refuses to start.
claims.security.jwt.secret=${JWT_SECRET:}
claims.security.jwt.expiry=${JWT_EXPIRY:60m}

# The one service this one calls. Override with CLAIM_SERVICE_URL when the Claim Service is elsewhere.
claims.services.claim.url=${CLAIM_SERVICE_URL:http://localhost:8181}
claims.downstream.connect-timeout=2s
claims.downstream.read-timeout=10s
