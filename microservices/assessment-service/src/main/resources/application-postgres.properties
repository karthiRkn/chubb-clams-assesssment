# Opt-in PostgreSQL profile: --spring.profiles.active=postgres. Credentials come ONLY from environment variables.
# NOT VERIFIED: this profile has not been run against a real PostgreSQL server. The database must already exist.
spring.datasource.url=${ASSESSMENT_DB_URL:jdbc:postgresql://localhost:5432/assessment_db}
spring.datasource.username=${ASSESSMENT_DB_USERNAME}
spring.datasource.password=${ASSESSMENT_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect